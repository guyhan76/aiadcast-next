# Free beta: Render serves Node/sharp; Supabase persists SQL and private assets.
# No disk or paid instance. OpenAI usage is billed separately.
services:
  - type: web
    name: aiadcast-next-beta
    runtime: docker
    dockerfilePath: ./Dockerfile.beta
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AIADCAST_NEXT_STAGING_OPENAI_API_KEY
        sync: false
      - key: AIADCAST_BETA_DATA_DIR
        value: /tmp/aiadcast-beta
      - key: AIADCAST_BETA_MONTHLY_BUDGET_USD
        value: "1"
      - key: AIADCAST_BETA_ENABLE_GENERATION
        value: "true"
      - key: AIADCAST_BETA_ENABLE_ASSISTANT
        value: "false"
      - key: AIADCAST_EMAIL_ENABLED
        value: "false"
      - key: AIADCAST_TOSS_TEST_ENABLED
        value: "false"

