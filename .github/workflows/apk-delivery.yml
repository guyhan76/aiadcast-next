name: Copy existing signed APK for private file delivery
on:
  push:
    branches: [delivery/preview-0.2.82]
    paths: [.github/workflows/apk-delivery.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Stage approved verified APK copy in the existing private repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p delivery
          gh release download preview-0.2.82-code84-ecdba7b51955 --repo "$GH_REPO" --pattern 'aiadcast-0.2.82-preview-code84-signed-candidate.apk' --dir delivery
          python3 - <<'PY'
          import os, json, base64, hashlib, pathlib, urllib.request
          data = pathlib.Path("delivery/aiadcast-0.2.82-preview-code84-signed-candidate.apk").read_bytes()
          assert len(data) == 18525441
          assert hashlib.sha256(data).hexdigest() == "81e0822301810be75241280881da0040083baaa2ece66ba73d30add93baffd50"
          encoded = base64.b64encode(data).decode("ascii")
          manifest = []
          for index, start in enumerate(range(0, len(encoded), 524288)):
              text_part = encoded[start:start + 524288]
              payload = json.dumps({"content":text_part,"encoding":"utf-8"}).encode()
              req = urllib.request.Request("https://api.github.com/repos/guyhan76/aiadcast-next/git/blobs",
                  data=payload, method="POST", headers={
                      "Authorization":"Bearer " + os.environ["GH_TOKEN"],
                      "Accept":"application/vnd.github+json", "Content-Type":"application/json",
                      "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  blob = json.load(response)
              manifest.append({"index":index,"sha":blob["sha"],"length":len(text_part)})
          print("APK_TRANSFER_MANIFEST=" + json.dumps(manifest))
          print("APK_SHA256=" + hashlib.sha256(data).hexdigest())
          PY
