name: Get verified APK download for direct delivery
on:
  push:
    branches: [delivery/preview-0.2.82]
    paths: [.github/workflows/apk-delivery.yml]
permissions:
  contents: read
jobs:
  download-link:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve the existing private release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(
              "https://api.github.com/repos/guyhan76/aiadcast-next/releases/assets/725741408",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/octet-stream",
                       "X-GitHub-Api-Version": "2022-11-28"})
          try:
              urllib.request.build_opener(NoRedirect()).open(req, timeout=30)
              raise RuntimeError("Expected a signed asset download redirect")
          except urllib.error.HTTPError as e:
              if e.code != 302:
                  raise
              url = e.headers.get("Location", "")
              if not url.startswith("https://release-assets.githubusercontent.com/"):
                  raise RuntimeError("Unexpected asset download host")
              print("APK_TRANSFER_URL=" + url)
          PY
