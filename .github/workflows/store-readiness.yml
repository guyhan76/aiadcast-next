name: Store readiness
on:
  push:
    branches: [feat/store-readiness-20261124]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund && npm run build && node native/prepare-android.mjs
      - name: Build unsigned upload candidate
        run: bash android/gradlew -p android -PAIADCAST_API_ORIGIN=https://aiadcast-next.onrender.com :app:bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: aiadcast-unsigned-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Exercise preview release checks
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome)"
          npx playwright test tests/web-payment-continue.spec.ts -g "Preview checkout keeps" --project=mobile
          npx playwright test tests/kakao-signin.spec.ts tests/membership.spec.ts tests/preview-delivery.spec.ts tests/input-example-guides.spec.ts --project=desktop --project=mobile
          npx playwright test tests/production-parity.spec.ts --project=desktop
          npm run test:domain
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund && npm run build
      - name: Run installed app on iPhone simulator
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec ios/project.yml
          mkdir -p dist/api/account
          echo '{"google":{"enabled":true},"kakao":{"enabled":true}}' > dist/api/account/capabilities
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/aiadcast-web.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          curl --retry 8 --retry-all-errors -fsS http://localhost:4173/api/account/capabilities
          device=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; print(next(d["udid"] for runtime, devices in json.load(sys.stdin)["devices"].items() if "iOS-" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test -project ios/Aiadcast.xcodeproj -scheme Aiadcast -configuration Debug -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/LoginScreen.xcresult"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator-result
          path: ${{ runner.temp }}/LoginScreen.xcresult
