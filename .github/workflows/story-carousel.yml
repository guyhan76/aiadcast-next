name: Story carousel
on:
  pull_request:
    paths:
      - "**/*carousel*"
      - "src/CarouselEditor.tsx"
      - "src/CreateCampaign.tsx"
      - "src/submit-ad-batch.ts"
      - "server/automatic-image-skills.mjs"
      - "server/text-assistant.mjs"
permissions:
  contents: read
jobs:
  carousel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:cloud
      - run: node --experimental-strip-types --test tests-domain/story-carousel.test.mjs tests-domain/batch-art-direction.test.mjs tests-domain/ad-batch.test.mjs
      - run: npm run build
      - run: node native/prepare-android.mjs
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile creation
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          npm test -- tests/story-carousel.spec.ts
