name: Direct test APK download
on:
  push:
    branches: [delivery/direct-test-apk-d4e126e7]
    paths: ['.github/workflows/direct-test-apk.yml']
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the existing signed test artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14869760896'
          run-id: 45280105595
          github-token: ${{ github.token }}
          path: signed
          merge-multiple: true
      - name: Verify the APK and attach it to a testing-only download
        working-directory: signed
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          apk=aiadcast-0.2.122.apk
          unzip -p "$apk" assets/web-release.json | jq -e '.commit == "d4e126e7659980cb6c7dff71278d0611e3ef9fee"'
          gh release create 'test-apk-0.2.122-d4e126e7' "$apk" --target 'd4e126e7659980cb6c7dff71278d0611e3ef9fee' --prerelease --latest=false --title 'aiadcast 0.2.122 · 영상 프롬프트 복사 테스트용 APK' --notes '서명된 Android Preview 테스트 빌드입니다. 영상 프롬프트 복사 버튼 확인용이며 일괄 이미지 생성·정밀편집 회귀 테스트에 미해결 항목이 있습니다.'
