name: Direct test APK download
on:
  push:
    branches: [delivery/direct-test-apk-2a888cdb]
    paths: ['.github/workflows/direct-test-apk.yml']
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the existing signed test artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14868887340'
          run-id: 45277822266
          github-token: ${{ github.token }}
          path: signed
          merge-multiple: true
      - name: Verify the APK and attach it to a testing-only download
        working-directory: signed
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          apk=aiadcast-0.2.122.apk
          unzip -p "$apk" assets/web-release.json | jq -e '.commit == "2a888cdbe0b5ab964f113be40663f862359c1b23"'
          gh release create 'test-apk-0.2.122-2a888cdb' "$apk" --target '2a888cdbe0b5ab964f113be40663f862359c1b23' --prerelease --latest=false --title 'aiadcast 0.2.122 · 영상 제작 확인 화면 테스트용 APK' --notes '서명된 Android Preview 테스트 빌드입니다. 영상 제작 전 크레딧 표시 확인용이며 일괄 이미지 생성·정밀편집 회귀 테스트에 미해결 항목이 있습니다.'
