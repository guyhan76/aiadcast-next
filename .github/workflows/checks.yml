name: App checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:isolation
      - run: npm run check:cloud
      - run: npm run typecheck
      - run: npm run test:domain
      - name: Render local dimension evaluation mock (no provider)
        run: node scripts/vision-evaluation-evidence.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          npm test
      - name: Release readiness report (informational; does not publish)
        run: npm run release:status -- internal
      - name: Upload reviewed campaign previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-previews
          path: artifacts/showcase/
          if-no-files-found: ignore
      - name: Upload browser check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload dimension evaluation mock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-evaluation-mock
          path: artifacts/showcase/vision-evaluation/
          retention-days: 7
          if-no-files-found: ignore
