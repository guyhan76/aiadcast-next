plugins {
    id 'com.android.application'
}

// Public backend address only. Never put a provider API key or signing secret here.
def publicApiOrigin = providers.gradleProperty('AIADCAST_API_ORIGIN').getOrElse('')
if (publicApiOrigin) {
    def parsed = new URI(publicApiOrigin)
    if (parsed.scheme != 'https' || !parsed.host || parsed.userInfo || parsed.query || parsed.fragment || (parsed.path && parsed.path != '/')) {
        throw new GradleException('AIADCAST_API_ORIGIN must be an HTTPS origin, without credentials, path, query or fragment.')
    }
    publicApiOrigin = publicApiOrigin.replaceAll('/$', '')
}

android {
    namespace 'com.selluplabs.aiadcast.next'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.selluplabs.aiadcast.next'
        minSdk 29
        targetSdk 36
        versionCode 65
        versionName '0.2.63'
        buildConfigField 'String', 'API_ORIGIN', '"' + publicApiOrigin + '"'
        buildConfigField 'boolean', 'ALLOW_TEST_CONFIG', 'false'
        resValue 'string', 'app_name', 'aiadcast'
    }
    signingConfigs {
        demo {
            def keyPath = providers.environmentVariable('AIADCAST_DEMO_KEYSTORE').orNull
            if (keyPath) storeFile file(keyPath)
            storePassword providers.environmentVariable('AIADCAST_DEMO_STORE_PASSWORD').orNull
            keyAlias 'aiadcast-demo'
            keyPassword providers.environmentVariable('AIADCAST_DEMO_STORE_PASSWORD').orNull
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'ALLOW_TEST_CONFIG', 'true'
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'aiadcast Dev'
        }
        preview {
            initWith debug
            buildConfigField 'boolean', 'ALLOW_TEST_CONFIG', 'true'
            // Separate install/data from older Dev APKs with unknown signing keys.
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'aiadcast Preview'
            debuggable false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        demo {
            initWith debug
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
            resValue 'string', 'app_name', 'aiadcast 시연'
            buildConfigField 'boolean', 'ALLOW_TEST_CONFIG', 'false'
            buildConfigField 'String', 'API_ORIGIN', '"https://aiadcast-next.onrender.com"'
            debuggable false
            signingConfig signingConfigs.demo
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No automatic release signing. The company must own the upload key.
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!file('src/main/assets/index.html').exists()) {
            throw new GradleException('Web assets missing. Run npm run build and node native/prepare-android.mjs from the repository root.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }
